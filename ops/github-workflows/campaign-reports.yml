# Campaign reports (replaces scheduled tasks #36 + #38 weekly, #41 + #08 step 10 daily).
# Cloudflare Pages cannot run a cron, so GitHub Actions calls the app's
# secret-protected endpoint. Needs repo secret REPORT_CRON_SECRET (same value
# as the Cloudflare Pages secret of project gershoncrm-report).
name: campaign-reports
on:
  schedule:
    - cron: '47 16 * * *'   # daily stats, 11:47 ET (EST) — after tasks #34, #35, #08
    - cron: '41 12 * * 1'   # weekly report, Monday 7:41 ET (EST)
  workflow_dispatch:
    inputs:
      kind:
        description: daily or weekly
        required: true
        default: daily
      date:
        description: optional YYYY-MM-DD (America/New_York)
        required: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call report.gershoncrm.com
        env:
          SECRET: ${{ secrets.REPORT_CRON_SECRET }}
          KIND: ${{ github.event.inputs.kind || (github.event.schedule == '41 12 * * 1' && 'weekly' || 'daily') }}
          DATE: ${{ github.event.inputs.date }}
        run: |
          test -n "$SECRET" || { echo "REPORT_CRON_SECRET repo secret missing"; exit 1; }
          url="https://report.gershoncrm.com/api/campaign-report?kind=${KIND}"
          [ -n "$DATE" ] && url="${url}&date=${DATE}"
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${SECRET}" "$url")
          cat out.json; echo
          test "$code" = "200"
